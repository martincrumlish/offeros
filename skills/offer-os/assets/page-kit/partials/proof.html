<section class="opk-section" data-offeros-section="proof">
  <div class="opk-container">
    <p class="opk-eyebrow">{{proof_eyebrow}}</p>
    <h2>{{proof_headline}}</h2>
    <p>{{proof_bridge}}</p>
    <div class="opk-grid opk-grid--3" data-offeros-proof-grid>
      <article class="opk-card" data-offeros-proof-card><h3>{{proof_1}}</h3><p>{{proof_1_copy}}</p></article>
      <article class="opk-card" data-offeros-proof-card><h3>{{proof_2}}</h3><p>{{proof_2_copy}}</p></article>
      <article class="opk-card" data-offeros-proof-card><h3>{{proof_3}}</h3><p>{{proof_3_copy}}</p></article>
    </div>
    <a class="opk-cta" data-offeros-cta data-offeros-post-hero-cta href="#checkout">{{proof_cta}}</a>
  </div>
</section>
