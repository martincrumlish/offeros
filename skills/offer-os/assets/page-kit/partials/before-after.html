<section class="opk-section opk-section--dark" data-offeros-section="before-after">
  <div class="opk-container">
    <p class="opk-eyebrow">{{before_after_eyebrow}}</p>
    <h2>{{before_after_headline}}</h2>
    <div class="opk-grid opk-grid--2" data-offeros-before-after>
      <article class="opk-card"><h3>{{before_label}}</h3><p>{{before_copy}}</p></article>
      <article class="opk-card"><h3>{{after_label}}</h3><p>{{after_copy}}</p></article>
    </div>
  </div>
</section>
