<section class="opk-section" data-offeros-section="product">
  <div class="opk-container">
    <p class="opk-eyebrow">{{product_eyebrow}}</p>
    <h2>{{product_reveal_headline}}</h2>
    <p>{{product_reveal_copy}}</p>
    <div class="opk-grid opk-grid--3" data-offeros-product-modules>
      <article class="opk-card"><h3>{{module_1}}</h3><p>{{module_1_copy}}</p></article>
      <article class="opk-card"><h3>{{module_2}}</h3><p>{{module_2_copy}}</p></article>
      <article class="opk-card"><h3>{{module_3}}</h3><p>{{module_3_copy}}</p></article>
    </div>
  </div>
</section>
