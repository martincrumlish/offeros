<section class="opk-section" data-offeros-section="fit">
  <div class="opk-container">
    <p class="opk-eyebrow">{{fit_eyebrow}}</p>
    <h2>{{fit_headline}}</h2>
    <div class="opk-grid opk-grid--2">
      <article class="opk-card"><h3>{{fit_label}}</h3><ul>{{fit_bullets}}</ul></article>
      <article class="opk-card"><h3>{{not_fit_label}}</h3><ul>{{not_fit_bullets}}</ul></article>
    </div>
  </div>
</section>
