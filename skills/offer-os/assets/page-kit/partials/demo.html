<section class="opk-section opk-section--dark" data-offeros-section="demo" data-offeros-optional-section>
  <div class="opk-container">
    <p class="opk-eyebrow">{{demo_eyebrow}}</p>
    <h2>{{demo_headline}}</h2>
    <figure class="opk-vsl-frame" data-offeros-demo-frame>
      <img src="{{demo_image}}" alt="{{demo_alt}}">
      <figcaption class="opk-video-caption"><strong>{{demo_label}}</strong><span>{{demo_caption}}</span></figcaption>
    </figure>
  </div>
</section>
