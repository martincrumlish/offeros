<section class="opk-section opk-section--dark" data-offeros-section="mechanism">

    <p class="opk-eyebrow">{{mechanism_eyebrow}}</p>
    <h2>{{mechanism_name}}</h2>
    <p>{{mechanism_explanation}}</p>
    <div class="opk-grid opk-grid--3" data-offeros-mechanism-steps>
      <article class="opk-card"><h3>{{mech_step_1}}</h3><p>{{mech_step_1_copy}}</p></article>
      <article class="opk-card"><h3>{{mech_step_2}}</h3><p>{{mech_step_2_copy}}</p></article>
      <article class="opk-card"><h3>{{mech_step_3}}</h3><p>{{mech_step_3_copy}}</p></article>
    </div>
  </div>
</section>
