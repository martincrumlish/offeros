<!-- offeros:block hero approved -->
<section class="oo-hero oo-hero-stacked-vsl" data-offeros-section="hero" data-offeros-hero-layout="stacked-vsl" data-offeros-hero-contract="stacked-vsl-hero-v2" data-offeros-template="offeros-stacked-vsl-v2" data-offeros-page-kit-block="approved">
  <div class="oo-hero-inner" data-offeros-hero-inner>
    <div class="oo-hero-copy-stack" data-offeros-hero-copy-stack>
      <p class="oo-buyer-pill" data-offeros-buyer-filter>{{buyerFilter}}</p>
      <p class="oo-prehead">{{prehead}}</p>
      <h1>{{headline}}</h1>
      <p class="oo-hero-copy">{{lead}}</p>
    </div>
    <figure class="oo-vsl-frame oo-hero-video-primary" data-offeros-hero-video data-offeros-hero-video-prominence="primary" data-offeros-hero-video-size="large">
      <img src="{{heroVslThumbnail}}" alt="{{offerName}} VSL preview" data-offeros-video-thumbnail>
      <button class="oo-play-button" type="button" data-offeros-video-play aria-label="Play VSL">Play</button>
      <figcaption class="oo-video-caption" data-offeros-video-caption>
        <strong>Watch the short pitch</strong>
        <span>See the mechanism, proof, and offer stack before you decide.</span>
      </figcaption>
    </figure>
    <div class="oo-price-strip" data-offeros-price-strip>
      <div><span class="oo-price">{{price}}</span><small>Total value in one static page kit</small></div>
      <p>Get the full direct-response sequence with the checkout handoff anchored on the page.</p>
      <a class="oo-cta" data-offeros-cta href="{{checkoutTarget}}">{{cta}}</a>
    </div>
    <ul class="oo-trust-row" data-offeros-trust-row>
      <li>Instant static HTML output</li>
      <li>External checkout handoff</li>
      <li>Approved OfferOS markers preserved</li>
    </ul>
  </div>
</section>
